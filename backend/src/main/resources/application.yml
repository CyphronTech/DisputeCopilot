server:
  servlet:
    session:
      timeout: 12h

spring:
  application:
    name: disputecopilot
  servlet:
    multipart:
      # Spring's 1 MB default rejects many ordinary policy PDFs. Uploads are one file per request.
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/disputecopilot
    username: disputecopilot
    password: disputecopilot
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  admin:
    # Optional. Unset (the desktop default), the admin creates their own login on first run;
    # set ADMIN_PASSWORD to manage the login from the environment instead.
    email: ${ADMIN_EMAIL:admin@disputecopilot.local}
    password: ${ADMIN_PASSWORD:}
  secret-key: ${SECRET_KEY:dev-only-secret-key-change-in-prod}

# Schema-discovery allowlist stand-in for the MVP demo profile.
# Real schema discovery (Architecture §Schema discovery and the bounded read tool)
# will replace this with rows an admin approves through the setup wizard.
connector:
  allowlist:
    orders: [order_id, customer_name, customer_email, product_name, created_at, currency, amount]
    payments: [order_id, status, processor_ref, paid_at]
    fulfillment: [order_id, carrier, awb, shipped_at, proof_of_delivery_url]
    refunds: [order_id, status, amount, decided_at]
    communications: [order_id, occurred_at, body, attachment_url]
