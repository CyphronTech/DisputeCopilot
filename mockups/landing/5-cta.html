<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><style>
  body { width: 1600px; }
  .section { min-height: 560px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .cta h2 { font-size: 40px; font-weight: 700; max-width: 620px; margin: 0 auto 18px; line-height: 1.12; }
  .cta p { color: var(--text-3); font-size: 15px; max-width: 460px; margin: 0 auto 34px; line-height: 1.6; }
  .cta-actions { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 56px; }
  .foot-line { display: flex; align-items: center; justify-content: center; gap: 28px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); border-top: 1px solid var(--border); padding-top: 28px; max-width: 640px; margin: 0 auto; }
</style></head>
<body>
<div class="section">
  <div class="cta">
    <p class="eyebrow" style="justify-content:center;">Pilot program</p>
    <h2>Talk to us about one merchant, one dispute type.</h2>
    <p>We ask for a workflow interview and a reviewed view definition before we ask for database access. A fully seeded demo runs without either.</p>
    <div class="cta-actions">
      <a class="btn btn-primary" href="#">Request a pilot</a>
      <a class="text-link" href="#">Read the architecture</a>
    </div>
    <div class="foot-line">
      <span>Self-hosted</span><span>BYOK</span><span>PostgreSQL + pgvector</span><span>Spring Boot</span>
    </div>
  </div>
</div>
</body></html>
